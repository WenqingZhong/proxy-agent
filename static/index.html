<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxy Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▣</span>
        <span>Proxy Agent</span>
      </div>

      <nav>
        <a class="nav-link" id="nav-policy" href="#/policy">
          <span>Voting policy</span>
          <span class="nav-meta" id="policy-count"></span>
        </a>
        <div class="nav-heading">Filings <span class="nav-meta" id="filing-count"></span></div>
        <ul id="filing-list" class="filing-list"></ul>
      </nav>

      <p class="rail-foot">Add or update a DEF 14A (.htm) in <code>data/filings/</code>, then
        <button class="link-btn" data-reanalyse="" title="Read every filing again and re-run it with the current policy settings and AI. Your decisions are kept and checked against the new recommendations.">re-analyse all filings</button>.</p>
    </aside>

    <main id="main" class="main">
      <div class="empty">Loading…</div>
    </main>

  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box" role="dialog" aria-label="Filing page"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
